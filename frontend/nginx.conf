server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: vue-router en modo history.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Estáticos con caché larga (Vite emite assets con hash).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # .mjs (worker de pdf.js) como JavaScript para el import() dinámico.
  location ~ \.mjs$ {
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
